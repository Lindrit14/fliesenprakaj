version: "3.9"

services:
  fliesenprakaj-dev:
    container_name: fliesenprakaj-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - HOST=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # Mount ONLY the project files, not the entire container
      - .:/app/src
      # Keep container node_modules intact
      - /app/node_modules
    restart: unless-stopped
